<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8d7da;
            color: #721c24;
        }

        .error-container {
            text-align: center;
            border: 1px solid #f5c6cb;
            background-color: #f8d7da;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .error-code {
            font-size: 72px;
            font-weight: bold;
        }

        .error-message {
            font-size: 24px;
            margin: 10px 0;
        }

        .error-description {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .home-link {
            text-decoration: none;
            color: #721c24;
            font-weight: bold;
            border: 1px solid #721c24;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        .home-link:hover {
            background-color: #721c24;
            color: #f8d7da;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-code">401</div>
    <div class="error-message">Inicie sesion primero</div>
    <div class="error-description">Necesita permisos para acceder a esta pagina.</div>
    <a href="/login" class="home-link">Volver al login</a>
</div>
</body>
</html>
