<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Piedra, Papel o Tijeras</title>
    <style>
        button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
<div style="text-align: center;">
    <h1>PIEDRA, PAPEL O TIJERAS</h1>
    <h3 th:if="${turno <= 2}">Turno del Jugador <span th:text="${turno}"></span></h3>
    <div th:if="${turno <= 2}">
        <form method="post">
            <button type="submit" name="opcion" value="piedra">🗿 Piedra</button>
            <button type="submit" name="opcion" value="papel">📄 Papel</button>
            <button type="submit" name="opcion" value="tijeras">✂️ Tijeras</button>
        </form>
    </div>
    <div th:if="${resultado != null}">
        <h2 th:text="${resultado}"></h2>
        <a href="/reiniciar-rps">Jugar de nuevo</a>
    </div>
</div>
</body>
</html>
