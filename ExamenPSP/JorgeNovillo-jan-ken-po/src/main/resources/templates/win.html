<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #cee09e;
            color: #46721c;
        }

        .error-container {
            text-align: center;
            border: 1px solid #f0f5c6;
            background-color: #f5f8d7;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .error-message {
            font-size: 24px;
            margin: 10px 0;
        }

        .error-description {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .home-link {
            text-decoration: none;
            color: #1c723a;
            font-weight: bold;
            border: 1px solid #1c722a;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        .home-link:hover {
            background-color: #054510;
            color: #1c723a;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-message">Ha ganado <span th:text="${vencedor}"></span></div>
    <div class="error-description">La partida se ha acabado, si quiere incie una nueva</div>
    <form method="get" action="/inicio">
        <button class="home-link" type="submit">Volver a jugar</button>
    </form>
</div>
</body>
</html>
