<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Juego de Cartas</title>
    <style>
        .contenedor { text-align: center; margin-top: 20px; }
        .mensaje { font-size: 1.2em; margin: 20px 0; color: #2c3e50; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="contenedor">
    <h1>JUEGO DE CARTAS POR TURNOS</h1>
    <p class="mensaje" th:text="${mensaje}"></p>
    <p>Rondas ganadas:</p>
    <p>Jugador 1: <span th:text="${rondasJ1}"></span></p>
    <p>Jugador 2: <span th:text="${rondasJ2}"></span></p>

    <form method="post" th:unless="${turno > 5}">
        <button type="submit">Jugar Ronda <span th:text="${turno}"></span></button>
    </form>

    <div th:if="${turno > 5}">
        <a href="/reiniciar-cartas">Jugar de nuevo</a>
    </div>
</div>
</body>
</html>
